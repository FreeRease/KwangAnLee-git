  <text x="676" y="139" fill="#E2E8F0" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600">DATA</text>
  <text x="891" y="186" fill="#93C5FD" font-family="Segoe UI,Arial,sans-serif" font-size="10" letter-spacing="2">02 / BUILD</text>
  <text x="891" y="209" fill="#E2E8F0" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600">MODEL</text>
