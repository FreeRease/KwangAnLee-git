<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">KwangAn Lee — Data Science, Machine Learning and LLM</title>
  <desc id="desc">Portfolio banner illustrating the flow from data to models to evidence.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0F172A"/><stop offset="1" stop-color="#172C46"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#60A5FA"/><stop offset="1" stop-color="#5EEAD4"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#E2E8F0" stroke-opacity="0.045"/></pattern>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#background)"/>
