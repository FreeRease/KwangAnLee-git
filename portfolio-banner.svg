  <text x="52" y="194" fill="#CBD5E1" font-family="Segoe UI,Arial,sans-serif" font-size="19">Data Science / Machine Learning / LLM</text>
  <text x="52" y="253" fill="#94A3B8" font-family="Segoe UI,Arial,sans-serif" font-size="14" letter-spacing="0.5">FROM DATA TO MODELS, WITH EVIDENCE.</text>
